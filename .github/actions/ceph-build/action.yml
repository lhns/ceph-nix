name: ceph-build
description: >-
  Makes .#ceph-<track> available in the Nix store without rebuilding it when the same derivation was built before
  (ADR 0011). Run after Nix is installed, in a checkout.
inputs:
  track:
    description: tentacle or umbrella
    required: true
  save:
    description: >-
      Save a cache entry after building. Only the ceph workflow does: Ceph is not bit-reproducible, so a second build
      saved by another workflow would replace the bytes that were released (ADR 0013).
    default: 'true'
runs:
  using: composite
  steps:
    - name: derivation and cache key
      id: key
      shell: bash # with pipefail
      env:
        TRACK: ${{ inputs.track }}
      run: |
        drv=$(nix path-info --derivation ".#ceph-$TRACK")
        hash=${drv#/nix/store/}
        hash=${hash%%-*}
        echo "drv=$drv"
        # fail now, not after a 2 h build, if the export and import do not work here
        probe=$(readlink -f "$(command -v nix)")
        probe=${probe%/bin/*}
        nix-store --export "$probe" | zstd -c | zstd -dc | nix-store --import
        nix config show trusted-users
        # Cache keys are immutable, so an incomplete entry under a fixed key would stay and force a rebuild on every
        # later run. Entries are saved under a key unique to this attempt instead, and restored by the prefix (the
        # hash has a fixed length, so the prefix is unambiguous); the newest match wins, which is the latest save.
        echo "base=ceph-$TRACK-$hash" | tee -a "$GITHUB_OUTPUT"
        echo "key=ceph-$TRACK-$hash-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | tee -a "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/ceph-$TRACK-cache" | tee -a "$GITHUB_OUTPUT"
    - name: restore the Nix cache of Ceph
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.base }}
    # The cache holds only the closure's store paths that cache.nixos.org does not serve (keep.txt, as a
    # nix-store --export stream) and the list of those it does (subst.txt). Importing needs the references of the
    # kept paths in the store, so those are substituted first. A failure here only means a build below.
    - name: import the cached Ceph
      if: steps.restore.outputs.cache-matched-key != ''
      shell: bash # with pipefail
      env:
        DIR: ${{ steps.key.outputs.dir }}
      run: |
        ls -lh "$DIR"
        xargs -a "$DIR/subst.txt" nix-store --realise >/dev/null || echo "::warning::cannot substitute the cached closure"
        zstd -dc "$DIR/keep.nar.zst" | nix-store --import >/dev/null || echo "::warning::cannot import the cached Ceph"
    - name: build or reuse the Ceph derivation
      id: build
      shell: bash # with pipefail
      env:
        TRACK: ${{ inputs.track }}
        KEY: ${{ steps.key.outputs.key }}
        MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        # every output of the derivation (out, lib, dev, ...): the image needs them all
        nix build --dry-run ".#ceph-$TRACK^*" 2>&1 | tee "$RUNNER_TEMP/dry.log"
        if grep -q 'will be built' "$RUNNER_TEMP/dry.log"; then
          built=true
          [ -z "$MATCHED" ] || echo "::warning::restored $MATCHED, but Nix still has to build Ceph: the cache is incomplete; saving a new entry"
        else
          built=false
        fi
        start=$SECONDS
        nix build -L --no-link --print-out-paths ".#ceph-$TRACK^*" | tee "$RUNNER_TEMP/ceph-$TRACK.outs"
        if [ "$built" = true ]; then verb="built from source"; else verb="restored from the cache"; fi
        echo "### Ceph $TRACK $verb in $((SECONDS - start))s (restored: ${MATCHED:-nothing}; key to save: $KEY)" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "built=$built" >>"$GITHUB_OUTPUT"
    - name: export what cache.nixos.org lacks
      if: steps.build.outputs.built == 'true' && inputs.save == 'true'
      shell: bash # with pipefail
      env:
        DIR: ${{ steps.key.outputs.dir }}
        TRACK: ${{ inputs.track }}
      run: |
        # closure of the outputs; a path is substitutable if cache.nixos.org answers 200 for it
        nix path-info -r $(cat "$RUNNER_TEMP/ceph-$TRACK.outs") | sort -u >"$RUNNER_TEMP/closure.txt"
        xargs -a "$RUNNER_TEMP/closure.txt" -P 32 -I{} bash -c 'p={}; h=${p#/nix/store/}; h=${h%%-*}
          c=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 "https://cache.nixos.org/$h.narinfo" || true)
          [ "$c" = 200 ] && echo "S $p" || echo "K $p"' | sort >"$RUNNER_TEMP/split.txt"
        rm -rf "$DIR"
        mkdir -p "$DIR"
        sed -n 's/^S //p' "$RUNNER_TEMP/split.txt" >"$DIR/subst.txt"
        sed -n 's/^K //p' "$RUNNER_TEMP/split.txt" >"$DIR/keep.txt"
        echo "closure: $(wc -l <"$RUNNER_TEMP/closure.txt") paths, not on cache.nixos.org: $(wc -l <"$DIR/keep.txt")"
        cat "$DIR/keep.txt"
        xargs -a "$DIR/keep.txt" nix-store --export | zstd -T0 -3 -o "$DIR/keep.nar.zst"
        du -sh "$DIR" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: save the Nix cache of Ceph
      if: steps.build.outputs.built == 'true' && inputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
