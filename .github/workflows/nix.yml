name: nix
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: KVM for NixOS VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm && sudo udevadm settle
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm
          test -w /dev/kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      # No local Nix on the dev machine: pushes get flake.lock and formatting written here.
      - name: flake.lock and nixfmt
        if: github.event_name == 'push'
        run: |
          nix flake lock
          git ls-files -z '*.nix' | xargs -0 nix fmt --
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=noreply@github.com commit -m "Update flake.lock, nixfmt"
            git push
          fi
      - run: nix flake check -L
