name: nix
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: KVM for NixOS VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      # No local Nix on the dev machine: branches get their flake.lock written here.
      - name: flake.lock
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          nix flake lock
          if ! git diff --quiet -- flake.lock || [ -n "$(git status --porcelain -- flake.lock)" ]; then
            git -c user.name=github-actions -c user.email=noreply@github.com commit -m "Update flake.lock" -- flake.lock ||
              { git add flake.lock && git -c user.name=github-actions -c user.email=noreply@github.com commit -m "Update flake.lock"; }
            git push
          fi
      - run: nix flake check -L
