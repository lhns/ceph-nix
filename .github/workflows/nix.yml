name: nix
on:
  push:
    paths-ignore: &skip
      - docs/**
      - LICENSE
  pull_request:
    paths-ignore: *skip
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # one run per ref at a time (the format step commits); never cancel a running one
  cancel-in-progress: false

jobs:
  # The only job with write access: it runs no PR code (pushes only) and commits flake.lock and formatting.
  # No local Nix on the dev machine, so pushes get both written here.
  format:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: flake.lock and nixfmt
        id: commit
        run: |
          nix flake lock
          git ls-files -z '*.nix' | xargs -0 nix fmt --
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=noreply@github.com commit -m "Update flake.lock, nixfmt"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  # Read-only, also for PR code. On a push it checks the commit `format` may just have made.
  check:
    needs: format
    if: ${{ !cancelled() && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.format.outputs.sha || github.sha }}
      - name: KVM for NixOS VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm && sudo udevadm settle
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm
          test -w /dev/kvm
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check -L
