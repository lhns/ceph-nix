name: explore
on:
  push:
    paths: [.github/workflows/explore.yml]
jobs:
  explore:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
      - uses: cachix/install-nix-action@v31
      - name: probe
        run: |
          set +e
          N=github:NixOS/nixpkgs/nixos-26.05
          for a in libstoragemgmt tcmu-runner luarocks lua5_4.pkgs.luarocks hostname inetutils rpcbind nfs-utils psmisc python312.pkgs.asyncssh python312.pkgs.python3-saml python312.pkgs.python-saml rtslib-fb sssd libnvme; do
            printf "%s: " $a; nix eval --raw "$N#$a.name" 2>&1 | tail -1; echo
          done
          out=$(nix build --no-link --print-out-paths "$N#ceph")
          lib=$(nix build --no-link --print-out-paths "$N#ceph^lib")
          echo "== cephadm"; cat $out/bin/cephadm; file -L $out/bin/.cephadm-wrapped; head -c 300 $out/bin/.cephadm-wrapped | head -3; unzip -l $out/bin/.cephadm-wrapped | head -30
          echo "== ceph wrapper"; cat $out/bin/ceph; cat $out/bin/ceph-mgr
          echo "== site-packages"; ls $out/lib/python3.12/site-packages | head -30
          py=$(nix build --no-link --print-out-paths "$N#ceph.pythonEnv")
          echo "== pyenv"; ls -la $py/bin | head -20; file -L $py/bin/python3; head -c 400 $py/bin/python3 | strings | head
          nix path-info -rS "$N#ceph" | sort -k2 -n | tail -25
          nix path-info -S "$N#ceph" "$N#ceph^lib"
          echo "== libexec"; find $lib/libexec; cat $lib/libexec/ceph/ceph-osd-prestart.sh | head -5
          echo "== lvm.conf"; lv=$(nix build --no-link --print-out-paths "$N#lvm2"); ls $lv/etc/lvm 2>&1; grep -n "udev_rules\|udev_sync\|obtain_device_list_from_udev" $lv/etc/lvm/lvm.conf
