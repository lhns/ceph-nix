name: ceph
# Image build and the tests that take its tarball (ADR 0006). Dispatch with `image` to test another flake package,
# e.g. the Umbrella image built on the self-hosted builder.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: Flake package (streamed image) to build and test
        default: ceph-image-tentacle
      upstream_image:
        description: Upstream image to compare with (parity.sh)
        default: quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
      expected_version:
        description: Expected `ceph -v` major.minor
        default: "20.2"
      pending_features:
        description: skip = dashboard UI and iSCSI are not provided yet (Tentacle dev track); empty = test them
        default: skip
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash # with pipefail
env:
  IMAGE_PKG: ${{ inputs.image || 'ceph-image-tentacle' }}
  UPSTREAM_IMAGE: ${{ inputs.upstream_image || 'quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9' }}
  EXPECTED_VERSION: ${{ inputs.expected_version || '20.2' }}
  PENDING_FEATURES: ${{ github.event_name == 'workflow_dispatch' && inputs.pending_features || 'skip' }}
  # Known x86-64-v3 image: the negative control for the CPU test.
  UPSTREAM_V3_IMAGE: quay.io/ceph/ceph:v21.2.0@sha256:c9e6ed4ac3fcf67b28f38358bb9619dee4d1dfb96ddd4b9b583eee316a15f04d

jobs:
  build:
    # same-repo PRs are covered by the push run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.load.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: nix build
        run: nix build -L --no-link --print-out-paths ".#$IMAGE_PKG" | tee stream.path
      - name: docker load and save
        id: load
        run: |
          $(cat stream.path) | zstd -T0 -3 -o image.tar.zst
          zstd -dc image.tar.zst | docker load | tee load.log
          tag=$(sed -n 's/^Loaded image: //p' load.log)
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
          docker images
          {
            echo '### Image'
            echo "$tag: $(docker image inspect -f '{{.Size}}' "$tag" | numfmt --to=iec) uncompressed, $(du -h image.tar.zst | cut -f1) zstd"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar.zst
          retention-days: 7
          compression-level: 0

  cpu:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          zstd -dc image.tar.zst | docker load
          docker pull -q "$UPSTREAM_V3_IMAGE"
      - name: ours on Ivy Bridge
        run: tests/cpu.sh "${{ needs.build.outputs.tag }}" IvyBridge pass
      - name: ours on Nehalem (plain x86-64-v2, no AVX)
        run: tests/cpu.sh "${{ needs.build.outputs.tag }}" Nehalem pass
      - name: upstream v21.2.0 on Ivy Bridge must be refused
        run: tests/cpu.sh "$UPSTREAM_V3_IMAGE" IvyBridge fail
      - name: upstream v21.2.0 on Haswell runs (the harness is not the failure)
        run: tests/cpu.sh "$UPSTREAM_V3_IMAGE" Haswell pass

  parity:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
      - run: |
          zstd -dc image.tar.zst | docker load
          docker pull -q "$UPSTREAM_IMAGE"
      - name: parity with upstream
        env:
          PARITY_PENDING_OK: ${{ env.PENDING_FEATURES == 'skip' && '1' || '0' }}
        run: tests/parity.sh "$UPSTREAM_IMAGE" "${{ needs.build.outputs.tag }}" "$EXPECTED_VERSION"
      - name: pending gaps (iSCSI) must show up when not tolerated
        if: env.PENDING_FEATURES == 'skip'
        run: |
          if PARITY_PENDING_OK=0 tests/parity.sh "$UPSTREAM_IMAGE" "${{ needs.build.outputs.tag }}" "$EXPECTED_VERSION" | tee strict.log; then
            echo "parity passed without PARITY_PENDING_OK, so pending gaps are not detected"; exit 1
          fi
          grep -q "^/usr/bin/tcmu-runner" strict.log

  cephadm:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: cephadm.sh
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/cephadm-logs
        run: tests/cephadm.sh image.tar.zst
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cephadm-logs
          path: cephadm-logs
          retention-days: 7

  # Report-only (upstream's snyk jobs need a token).
  scan:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - run: |
          zstd -d image.tar.zst -o image.tar
          docker run --rm -v "$PWD/image.tar:/image.tar:ro" aquasec/trivy:latest image --quiet --input /image.tar             --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/download-artifact@v8
        with:
          name: image
      - run: zstd -dc image.tar.zst | docker load
      - name: ceph-csi acceptance e2e on Rook with our Ceph image
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/e2e.sh "${{ needs.build.outputs.tag }}"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: /tmp/acceptance-e2e-logs/
          retention-days: 7
