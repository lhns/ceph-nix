name: ceph
# Both Ceph tracks: image build and the tests that take its tarball (ADR 0006), per track in ceph-track.yml, and the
# migration from Tentacle to Umbrella (ADR 0003).
on:
  # Skip pushes that cannot change the images or their tests. No concurrency cancelling: a superseded run is cancelled
  # by hand, never automatically.
  push:
    paths-ignore: &skip
      - docs/**
      - "**.md"
      - LICENSE
      - nix/modules/**
      - nix/tests/**
      - .github/dependabot.yml
      - .github/workflows/nix.yml
      - .github/workflows/release.yml
      - .github/workflows/bump.yml
      - .github/workflows/vm-tests.yml
  pull_request:
    paths-ignore: *skip
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash # with pipefail

jobs:
  # same-repo PRs are covered by the push run
  tentacle:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/ceph-track.yml
    with:
      track: tentacle
      image: ceph-image-tentacle
      expected_version: "20.2"

  umbrella:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/ceph-track.yml
    with:
      track: umbrella
      image: ceph-image-umbrella
      expected_version: "21.2"
      parity_userland: el10
      cached_ceph: true

  # In-place migration across the major (ADR 0003): a cephadm cluster on our Tentacle image is upgraded to our Umbrella
  # image with `ceph orch upgrade`. Ganesha goes 5.9 -> 9.16 and the cephx key types change on the way. Runs after
  # both tracks, whatever their other tests did (it only needs the image artifacts).
  migrate:
    needs: [tentacle, umbrella]
    if: ${{ !cancelled() && needs.tentacle.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image-tentacle
          path: tentacle
      - uses: actions/download-artifact@v8
        with:
          name: image-umbrella
          path: umbrella
      - name: upgrade.sh ours 20.2.4 -> ours 21.2.0
        timeout-minutes: 75
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/upgrade-logs
          NFS_UNREADABLE_OK: "1" # the old ganesha node stays in the grace table, as with upstream's images (see upgrade.sh)
        run: tests/upgrade.sh tentacle/image.tar.zst umbrella/image.tar.zst
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: migrate-logs
          path: upgrade-logs
          retention-days: 7

  # The same migration between upstream's own images: what a failure of `migrate` is measured against.
  migrate-control:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: upstream v21.2.0 as a docker-archive
        run: |
          ref=$(jq -r .umbrella tests/upstream-images.json)
          # skopeo takes a digest or a tag, not both
          skopeo copy "docker://${ref%%:*}@${ref#*@}" docker-archive:upstream-21.tar:quay.io/ceph/ceph:v21.2.0
          ls -lh upstream-21.tar
      - name: upgrade.sh upstream 20.2.4 -> upstream 21.2.0
        timeout-minutes: 75
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/upgrade-logs
          NFS_UNREADABLE_OK: "1"
        run: tests/upgrade.sh "$(jq -r .tentacle tests/upstream-images.json)" upstream-21.tar
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: migrate-control-logs
          path: upgrade-logs
          retention-days: 7
