# TEMPORARY control: does upstream v21.2.0 show CEPHADM_STRAY_DAEMON for a fresh NFS cluster? Delete before merge.
name: ctl-nfs
on:
  push:
    paths: [.github/workflows/ctl-nfs.yml]
permissions:
  contents: read
jobs:
  nfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -Eeuo pipefail
          art=$PWD/art; mkdir -p "$art"
          work=$(sudo mktemp -d /mnt/ctl.XXXX); sudo chown "$USER" "$work"
          . tests/lib.sh
          host_setup
          image=$(jq -r .umbrella tests/upstream-images.json)
          tool_image=$image
          sudo podman pull -q "$image"
          sudo podman run --rm --entrypoint cat "$image" /usr/sbin/cephadm >"$work/cephadm"; chmod +x "$work/cephadm"
          ip=$(hostname -I | awk '{print $1}')
          sudo "$work/cephadm" --image "$image" bootstrap --mon-ip "$ip" --single-host-defaults --skip-monitoring-stack --allow-fqdn-hostname --no-cleanup-on-failure
          sudo podman run -d --name toolbox --net=host --privileged -v /etc/ceph:/etc/ceph --entrypoint sleep "$image" infinity >/dev/null
          loop_osds
          wait_for 600 "3 OSDs" osds_up
          tbx ceph fs volume create cephfs
          wait_for 300 "mds" mds_active
          tbx ceph mgr module enable nfs || true
          tbx ceph nfs cluster create nfs1 "1 $(hostname)"
          wait_for 300 "nfs running" daemon_running nfs
          tbx ceph nfs export create cephfs --cluster-id nfs1 --pseudo-path /cephfs --fsname cephfs
          for i in $(seq 12); do sleep 30; echo "== $((i*30))s"; tbx ceph health detail; done
          tbx ceph orch ps --daemon-type nfs
          tbx ceph service dump
