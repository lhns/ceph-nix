name: bump
# Weekly: flake.lock update as a PR, and a watch for new upstream releases: Ceph (both tracks) and the ceph-csi that
# tests/ceph-csi.json pins. Each opens one issue per release; nothing here changes Ceph or any pin itself.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash # with pipefail

jobs:
  flake-lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push bump/flake-lock
      pull-requests: write
      actions: write # dispatch the test workflows on that branch
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bump/flake-lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: nix flake update
        run: nix flake update
      - name: branch, PR and tests
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock is up to date" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff flake.lock | grep -E '^[-+] +"(rev|lastModified)"' || true
          git -c user.name=github-actions -c user.email=noreply@github.com checkout -B "$BRANCH"
          git -c user.name=github-actions -c user.email=noreply@github.com commit -am "Update flake.lock"
          git push --force origin "$BRANCH"
          {
            echo "Weekly \`nix flake update\`. Merge when the checks on this branch are green."
            echo
            echo "A PR created with the workflow token does not trigger workflows, so \`bump\` started \`ceph\`,"
            echo "\`vm-tests\` and \`nix\` on \`$BRANCH\` by hand (workflow_dispatch); their runs are attached to the branch head. If you"
            echo "push to this branch yourself, the push triggers them as usual."
            echo
            echo "A changed digest after merging makes the next release (ADR 0003); an unchanged one makes none."
          } > body.md
          pr=ok
          if [ -n "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file body.md || pr=failed
          else
            gh pr create --head "$BRANCH" --base main --title "Update flake.lock" --body-file body.md || pr=failed
          fi
          # the tests run either way, so the branch is checkable even when the PR could not be opened
          gh workflow run nix.yml --ref "$BRANCH"
          gh workflow run ceph.yml --ref "$BRANCH"
          gh workflow run vm-tests.yml --ref "$BRANCH"
          if [ "$pr" = failed ]; then
            echo "::error::branch $BRANCH is pushed and tested, but the PR could not be created or updated. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open it by hand."
            exit 1
          fi
          echo "Updated PR for $BRANCH; started nix, ceph and vm-tests on it" | tee -a "$GITHUB_STEP_SUMMARY"

  upstream:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: newer upstream releases?
        run: |
          # An issue titled $1 with the body file $2, unless one with that title exists. Open or closed: a closed
          # issue means it was handled, so never a second one.
          open_issue_once() {
            local title=$1 body=$2 existing
            existing=$(gh issue list --state all --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
            if [ -n "$existing" ]; then
              echo "issue #$existing already exists: $title" | tee -a "$GITHUB_STEP_SUMMARY"
              return
            fi
            gh issue create --title "$title" --body-file "$body"
          }

          # Ceph: the pins are tests/upstream-images.json, one per track, e.g. .tentacle.ref = quay.io/ceph/ceph:v20.2.5@sha256:...
          for track in $(jq -r 'keys[]' tests/upstream-images.json); do
            pinned=$(jq -r --arg t "$track" '.[$t].ref' tests/upstream-images.json | sed -n 's|^quay.io/ceph/ceph:\(v[0-9]*\.[0-9]*\.[0-9]*\)@.*|\1|p')
            [[ $pinned =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || { echo "::error::no pinned image for $track in tests/upstream-images.json"; exit 1; }
            series="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            : > tags.txt
            for page in 1 2 3 4 5; do
              curl -fsS "https://quay.io/api/v1/repository/ceph/ceph/tag/?filterTag=$series.&onlyActiveTags=true&limit=100&page=$page" > page.json
              jq -r --arg s "$series" '.tags[] | select(.name | startswith($s + ".") and test("^[^.]+[.][^.]+[.][0-9]+$")) | "\(.name) \(.manifest_digest)"' page.json >> tags.txt
              [ "$(jq -r '.has_additional' page.json)" = true ] || break
            done
            latest=$(sort -V tags.txt | tail -n1)
            latest_tag=${latest% *}; latest_digest=${latest#* }
            echo "$track: pinned $pinned, newest in $series: ${latest_tag:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -z "$latest_tag" ] || [ "$(printf '%s\n%s\n' "$pinned" "$latest_tag" | sort -V | tail -n1)" = "$pinned" ]; then
              continue
            fi
            cat > body.md <<EOF
          Upstream published \`quay.io/ceph/ceph:$latest_tag\` (\`$latest_digest\`); the $track track is pinned to \`$pinned\`.
          Nothing is bumped automatically. To move to it (ADR 0008):

          - [ ] Check that nixpkgs' \`ceph\` is $latest_tag (Tentacle) or bump the source in \`nix/pkgs/ceph\` (Umbrella).
          - [ ] Re-check every companion version against the new upstream image: \`podman run --rm --entrypoint rpm quay.io/ceph/ceph:$latest_tag -q nfs-ganesha tcmu-runner ceph-iscsi libstoragemgmt\` (versions in \`nix/pkgs/\`).
          - [ ] Update the $track \`ref\` (tag and digest) in \`tests/upstream-images.json\` and \`expected_version\` in \`.github/workflows/ceph.yml\`. For Umbrella also \`nixPullHash\` there: the fixed-output hash of the amd64 pull (a build with a wrong one prints the real hash).
          - [ ] Run \`ceph\` (parity, upgrade from upstream, migration) and \`vm-tests\`; the next release number follows from ADR 0003.
          EOF
            open_issue_once "Upstream Ceph $latest_tag released" body.md
          done

          # ceph-csi: tests/ceph-csi.json pins the release the e2e test deploys (tests/e2e.sh)
          pinned=$(jq -r .tag tests/ceph-csi.json)
          latest=$(gh api repos/ceph/ceph-csi/releases/latest --jq .tag_name)
          re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $pinned =~ $re && $latest =~ $re ]] || { echo "::error::unexpected ceph-csi tags: pinned '$pinned', latest '$latest'"; exit 1; }
          echo "ceph-csi: pinned $pinned, newest release: $latest" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$pinned" != "$latest" ] && [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n1)" = "$latest" ]; then
            cat > body.md <<EOF
          Upstream published ceph-csi \`$latest\`; \`tests/ceph-csi.json\` is pinned to \`$pinned\`.
          The e2e test deploys the x86-64-v2 build of it from lhns/ceph-csi-x86-64-v2, so that image has to exist first.
          Nothing is bumped automatically.

          - [ ] Wait for the release \`$latest\` in [lhns/ceph-csi-x86-64-v2](https://github.com/lhns/ceph-csi-x86-64-v2/releases). Its daily \`release\` workflow builds and tests every stable upstream version, pushes \`ghcr.io/lhns/ceph-csi-x86-64-v2:$latest\` and records the image digest in the release notes (a failed version is retried the next day).
          - [ ] Set \`tag\` to \`$latest\` and \`image\` to \`ghcr.io/lhns/ceph-csi-x86-64-v2@sha256:<digest from the release>\` in \`tests/ceph-csi.json\`.
          - [ ] Run \`ceph\` (its \`e2e\` jobs deploy it on Rook with our Ceph image).
          EOF
            open_issue_once "Upstream ceph-csi $latest released" body.md
          fi
