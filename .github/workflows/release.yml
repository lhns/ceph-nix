name: release
# Releases the images ceph.yml tested, one per Ceph track (ADR 0003): ghcr.io/lhns/ceph-nix:v<ver>-<n>, only when
# the image differs from the newest v<ver>-* of its own version. The released file is the image-<track> artifact of
# that ceph run, not a rebuild. Publishing is off until the repo variable PUBLISH is 'true'; without it this is a dry
# run that prints the plan to the step summary.
on:
  # Whichever of the two finishes last finds both green in the gate and releases; the other one stops there.
  workflow_run:
    workflows: [ceph, vm-tests]
    types: [completed]
  workflow_dispatch:
# One release at a time; never cancel one in flight (a half-done release is worse than a queued one).
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash # with pipefail
env:
  REGISTRY_IMAGE: ghcr.io/lhns/ceph-nix
  # The commit ceph.yml tested; for a dispatch, the dispatched ref's head.
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # Publishing needs the tested main commit: never from a branch dispatch or a fork's PR run.
  CAN_PUBLISH: >-
    ${{ vars.PUBLISH == 'true'
    && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    || github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') }}

jobs:
  # One gate for ceph.yml and vm-tests. The release commit (SOURCE_SHA) must be main's head and have
  # (a) a successful ceph.yml push run of its own (its image artifacts are what gets released), and
  # (b) a successful vm-tests run that covers it: the VM tests back the "runs without AVX2" claim.
  # A run that is missing or still going is "not ready" (ok=false, a notice): the workflow that finishes last
  # releases. A finished run that did not succeed is an error.
  # vm-tests skips pushes that touch only its paths-ignore files, so a main commit may have no run of its own. Rule
  # for (b): take the newest vm-tests run on main whose commit is an ancestor of (or is) the release commit and that
  # is not older than the last commit that would have triggered vm-tests. That run covers the release commit because
  # nothing since it changed what the VMs run.
  # KEEP the pathspec below in step with vm-tests.yml's paths-ignore.
  # A dispatch from a branch is a dry run: it needs a ceph run of that commit (for the artifacts) but neither main's
  # head nor vm-tests.
  gate:
    # workflow_run fires for every ceph and vm-tests run: only a successful push to main is a release candidate
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
      ceph_run: ${{ steps.gate.outputs.ceph_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: main's head with green ceph and vm-tests runs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$SOURCE_SHA
          dry=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then dry=true; fi
          not_ready() { echo "::notice::not ready: $*"; echo ok=false >>"$GITHUB_OUTPUT"; exit 0; }

          # only main's head is released
          if [ "$dry" = false ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
            [ "$head" = "$sha" ] || not_ready "$sha is not main's head ($head); only the head is released"
          fi

          # (a) ceph.yml
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ceph.yml/runs?head_sha=$sha&per_page=50" >ceph-runs.json
          run=$(jq -r --arg dry "$dry" '[.workflow_runs[] | select($dry == "true" or (.event == "push" and .head_branch == "main"))]
            | first // empty | [.id, .status, (.conclusion // "")] | @tsv' ceph-runs.json)
          [ -n "$run" ] || not_ready "no ceph run for $sha (yet; ceph.yml skips pushes that cannot change the images)"
          read -r ceph_run status conclusion <<<"$run"
          echo "ceph run $ceph_run for $sha: $status ${conclusion:-}"
          [ "$status" = completed ] || not_ready "ceph run $ceph_run is still $status"
          if [ "$conclusion" != success ]; then
            echo "::error::ceph run $ceph_run for $sha is '$conclusion', not success"; exit 1
          fi
          # the image artifacts expire (retention-days in ceph-track.yml); a release never rebuilds them
          for t in tentacle umbrella; do
            expired=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ceph_run/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"image-$t\") | .expired")
            if [ "$expired" != false ]; then
              echo "::error::artifact image-$t of ceph run $ceph_run is missing or expired (ceph-track.yml keeps them 7 days); re-run ceph.yml for $sha, then release again"
              exit 1
            fi
          done

          # (b) vm-tests
          if [ "$dry" = true ]; then
            echo "dispatch from $GITHUB_REF: main's head and vm-tests not required for a dry run"
          else
            need=$(git log -1 --format=%H "$sha" -- . ':(exclude)docs' ':(exclude)*.md' ':(exclude)LICENSE' \
              ':(exclude)tests/*.sh' ':(exclude)tests/*.txt' ':(exclude)tests/*.json' \
              ':(exclude).github/dependabot.yml' ':(exclude).github/workflows/ceph.yml' \
              ':(exclude).github/workflows/ceph-track.yml' ':(exclude).github/workflows/nix.yml')
            [ -n "$need" ] || need=$sha
            echo "last commit that triggers vm-tests: $need"
            vm=
            while IFS=$'\t' read -r id vhead vstatus vconclusion; do
              if git merge-base --is-ancestor "$need" "$vhead" 2>/dev/null && git merge-base --is-ancestor "$vhead" "$sha" 2>/dev/null; then
                vm="$id $vhead $vstatus $vconclusion"; break
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vm-tests.yml/runs?branch=main&per_page=100" \
              --jq '.workflow_runs[] | [.id, .head_sha, .status, (.conclusion // "")] | @tsv')
            [ -n "$vm" ] || not_ready "no vm-tests run on main covers $sha (needs one for $need or a later commit up to $sha)"
            read -r id vhead vstatus vconclusion <<<"$vm"
            echo "vm-tests run $id for $vhead: $vstatus ${vconclusion:-}"
            [ "$vstatus" = completed ] || not_ready "vm-tests run $id for $vhead is still $vstatus"
            if [ "$vconclusion" != success ]; then
              echo "::error::vm-tests run $id for $vhead is '$vconclusion', not success"; exit 1
            fi
          fi
          {
            echo ok=true
            echo "ceph_run=$ceph_run"
          } >>"$GITHUB_OUTPUT"
          echo "gate passed for $sha (ceph run $ceph_run)"

  plan:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # the package is private until made public; anonymous reads would see "no tags"
      actions: read # the image artifacts of the ceph run
    strategy:
      fail-fast: false
      matrix:
        # One entry per released track. The Ceph version comes from the image itself (its version label).
        # Companions are only evaluated for their version, nothing is built here.
        include:
          - package: ceph-image-tentacle
            companions: tcmu-runner-tentacle ceph-iscsi-tentacle libstoragemgmt-tentacle
            track: tentacle
          - package: ceph-image-umbrella
            companions: tcmu-runner-umbrella ceph-iscsi-umbrella libstoragemgmt-umbrella nfs-ganesha-umbrella
            track: umbrella
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: cachix/install-nix-action@v31
      - name: the tested image
        uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.track }}
          run-id: ${{ needs.gate.outputs.ceph_run }}
          github-token: ${{ github.token }}
      - name: image config
        run: |
          zstd -dc image.tar.zst > image.tar
          cfg=$(tar -xOf image.tar manifest.json | jq -r '.[0].Config')
          tar -xOf image.tar "$cfg" > config.json
      - name: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          COMPANIONS: ${{ matrix.companions }}
        run: |
          # Image identity: the config with the revision label removed, hashed. The config holds the layer
          # diff_ids (uncompressed content), env, cmd and labels, so it does not depend on how a registry
          # compresses layers; the manifest digest would. The revision label is the commit, which differs on
          # every commit even when nothing in the image does, so it is excluded (ADR 0003).
          ident() { jq -S -c 'del(.config.Labels["org.opencontainers.image.revision"]) | del(.container_config)' | sha256sum | cut -d' ' -f1; }

          ver=$(jq -r '.config.Labels["org.opencontainers.image.version"]' config.json)
          [[ $ver =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::cannot read the Ceph version from the image ('$ver')"; exit 1; }
          config_digest=sha256:$(sha256sum config.json | cut -d' ' -f1)
          ident_new=$(ident < config.json)

          echo "$GH_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          if tags=$(skopeo list-tags "docker://$REGISTRY_IMAGE" 2> err.log); then
            tags=$(jq -r '.Tags[]' <<<"$tags")
          elif grep -qiE 'name unknown|not found|404' err.log; then
            tags=
          else
            cat err.log; echo "::error::cannot list tags of $REGISTRY_IMAGE"; exit 1
          fi
          last=$(grep -E "^v${ver//./\\.}-[0-9]+\$" <<<"$tags" | sed 's/.*-//' | sort -n | tail -n1 || true)
          if [ -z "$last" ]; then
            newest=none; changed=true; n=1
          else
            newest="v$ver-$last"
            ident_old=$(skopeo inspect --config "docker://$REGISTRY_IMAGE:$newest" | ident)
            if [ "$ident_old" = "$ident_new" ]; then changed=false; else changed=true; fi
            n=$((last + 1))
          fi
          tag="v$ver-$n"
          repair=false
          if [ "$changed" = false ]; then
            # an earlier run pushed the image and failed before the git tag and the release: finish that one
            if err=$(gh release view "$newest" --repo "$GITHUB_REPOSITORY" 2>&1 >/dev/null); then
              :
            elif grep -qi 'not found' <<<"$err"; then
              pushed=$(skopeo inspect --raw "docker://$REGISTRY_IMAGE:$newest" | jq -r '.config.digest')
              if [ "$pushed" = "$config_digest" ]; then
                changed=true; repair=true; tag=$newest
              else
                echo "::warning::$newest has no GitHub release and was built from another commit; not repaired"
              fi
            else
              echo "$err"; echo "::error::cannot look up the release $newest"; exit 1
            fi
          fi

          companions=
          for p in $COMPANIONS; do
            companions+="- $p $(nix eval --raw ".#$p.version" 2>/dev/null || echo unknown)"$'\n'
          done
          lock() { jq -r --arg k "$1" '.nodes[$k].locked.rev' flake.lock; }
          {
            echo "package=$PACKAGE"; echo "ver=$ver"; echo "tag=$tag"; echo "changed=$changed"; echo "newest=$newest"
            echo "config_digest=$config_digest"; echo "identity=$ident_new"
            echo "nixpkgs=$(lock nixpkgs)"; echo "opencas_nix=$(lock opencas-nix)"; echo "open_cas_src=$(lock open-cas-src)"
          } | tee plan.env
          printf '%s' "$companions" > companions.txt
          {
            echo "### $PACKAGE"
            if [ "$changed" = true ]; then
              verb="would publish"; [ "$CAN_PUBLISH" = true ] && verb="publishing"
              [ "$repair" = true ] && verb="$verb (finishing the git tag and release of the pushed image)"
              echo "$verb \`$tag\`, config digest \`$config_digest\`, identity \`$ident_new\`, newest existing: \`$newest\`"
            else
              echo "nothing to publish: identical to \`$newest\` (identity \`$ident_new\`, config digest \`$config_digest\`)"
            fi
            echo
            echo "Commit \`$SOURCE_SHA\`, ceph run \`${{ needs.gate.outputs.ceph_run }}\`; publishing enabled: \`$CAN_PUBLISH\` (variable PUBLISH, tested main commit only)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: env.CAN_PUBLISH == 'true'
        with:
          name: release-${{ matrix.package }}
          path: |
            plan.env
            companions.txt
          retention-days: 1

  publish:
    needs: [gate, plan]
    if: needs.plan.result == 'success' && vars.PUBLISH == 'true' && (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the git tag and the release
      packages: write
      actions: read # the image artifact of the ceph run
    strategy:
      fail-fast: false
      matrix:
        include: # keep in step with plan's matrix
          - package: ceph-image-tentacle
            track: tentacle
          - package: ceph-image-umbrella
            track: umbrella
    steps:
      - name: still main's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main may have moved since the gate; a newer commit gets its own release
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$head" = "$SOURCE_SHA" ]; then
            echo current=true >>"$GITHUB_OUTPUT"
          else
            echo "::notice::$SOURCE_SHA is no longer main's head ($head); not publishing"
            echo current=false >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.head.outputs.current == 'true'
        with:
          name: release-${{ matrix.package }}
      - name: the tested image
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.track }}
          run-id: ${{ needs.gate.outputs.ceph_run }}
          github-token: ${{ github.token }}
      - name: publish
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -a; . ./plan.env; set +a
          if [ "$changed" != true ]; then echo "$package: unchanged, nothing to publish"; exit 0; fi
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          zstd -dc image.tar.zst > image.tar
          # the artifact is what plan measured; check before anything is pushed
          cfg=$(tar -xOf image.tar manifest.json | jq -r '.[0].Config')
          [ "sha256:$(tar -xOf image.tar "$cfg" | sha256sum | cut -d' ' -f1)" = "$config_digest" ] \
            || { echo "::error::the image artifact differs from the one plan measured"; exit 1; }
          # Idempotent: the same image under the tag (a run that failed half-way, or two runs racing) is not pushed
          # again; another image under it is an error. Never overwrite.
          if existing=$(skopeo inspect --raw "docker://$REGISTRY_IMAGE:$tag" 2>err.log); then
            [ "$(jq -r '.config.digest' <<<"$existing")" = "$config_digest" ] \
              || { echo "::error::$REGISTRY_IMAGE:$tag already exists with another image"; exit 1; }
            manifest=$(skopeo inspect --format '{{.Digest}}' "docker://$REGISTRY_IMAGE:$tag")
            echo "$REGISTRY_IMAGE:$tag is already pushed ($manifest)"
          elif grep -qiE 'manifest unknown|name unknown|not found|404' err.log; then
            skopeo copy --format v2s2 --digestfile digest.txt "docker-archive:image.tar" "docker://$REGISTRY_IMAGE:$tag"
            manifest=$(cat digest.txt)
            pushed=$(skopeo inspect --raw "docker://$REGISTRY_IMAGE@$manifest" | jq -r '.config.digest')
            [ "$pushed" = "$config_digest" ] || { echo "::error::pushed config $pushed differs from built $config_digest"; exit 1; }
          else
            cat err.log; echo "::error::cannot look up $REGISTRY_IMAGE:$tag"; exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists"; exit 0
          fi
          {
            echo "Ceph $ver, track \`$package\`, built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA"
            echo
            echo "Pin by digest:"
            echo
            echo '```'
            echo "$REGISTRY_IMAGE@$manifest"
            echo '```'
            echo
            echo "- config digest (image ID): \`$config_digest\`"
            echo "- image identity (config without the revision label; decides a new release): \`$identity\`"
            echo "- nixpkgs: \`$nixpkgs\`"
            echo "- opencas-nix: \`$opencas_nix\` (open-cas-src: \`$open_cas_src\`)"
            echo "- previous release of this Ceph version: $newest"
            echo
            echo "Companion versions (flake packages):"
            echo
            cat companions.txt
          } > notes.md
          # creates the git tag at SOURCE_SHA unless it exists
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "$tag" --notes-file notes.md
          {
            echo "### Published $tag"
            echo "\`$REGISTRY_IMAGE@$manifest\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
