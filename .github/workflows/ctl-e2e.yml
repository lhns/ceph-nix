# TEMPORARY control: ceph-csi acceptance e2e on upstream's v21.2.0 image. Delete before merge.
name: ctl-e2e
on:
  push:
    paths: [.github/workflows/ctl-e2e.yml]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: docker pull "$(jq -r .umbrella tests/upstream-images.json)"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: tests/e2e.sh "$(jq -r .umbrella tests/upstream-images.json)"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-control
          path: /tmp/acceptance-e2e-logs/
          retention-days: 7
