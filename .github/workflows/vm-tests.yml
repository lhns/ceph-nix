# Slow NixOS VM tests (outside `nix flake check`): the negative control (upstream's image fails on a CPU without
# AVX2, ours runs) and the cephadm host module with our image on such a CPU, on two nodes (~30 minutes), for both
# Ceph tracks. Ceph comes from the ceph-build action (ADR 0011).
name: vm-tests
on:
  workflow_dispatch:
  # Skip pushes that cannot change what these VMs run. No concurrency cancelling: a superseded run is cancelled by
  # hand, never automatically.
  push:
    paths-ignore: &skip
      - docs/**
      - "**.md"
      - LICENSE
      - tests/*.sh  # not tests/smoke.c: nix/pkgs/ceph-smoke.nix builds it
      - tests/*.txt
      - tests/*.json
      - .github/dependabot.yml
      - .github/workflows/ceph.yml
      - .github/workflows/ceph-track.yml
      - .github/workflows/nix.yml
  pull_request:
    paths-ignore: *skip

jobs:
  vm-test:
    # same-repo PRs are covered by the push run (the Ceph cache of a branch is not visible to its PR runs)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: test-ceph-cpu
            track: tentacle
          - test: test-ceph-host
            track: tentacle
          - test: test-ceph-cpu-umbrella
            track: umbrella
          - test: test-ceph-host-umbrella
            track: umbrella
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /
      - name: KVM for NixOS VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm && sudo udevadm settle
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm
          test -w /dev/kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - uses: ./.github/actions/ceph-build
        with:
          track: ${{ matrix.track }}
      - run: nix build -L --no-link .#${{ matrix.test }}
      - if: always()
        run: df -h /
