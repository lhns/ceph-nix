name: p2-probe
# Temporary (branch build-parity): cheap checks of the build changes before the 1.5 h builds.
on:
  push:
    branches: [build-parity]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash # with pipefail
jobs:
  pmdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build -L --no-link --print-out-paths .#pmdk | tee out.txt
      - run: |
          o=$(cat out.txt)
          find "$o" -type f | head -80
          for f in $(find "$o" -name 'libpmem*.so*' -type f); do echo "$f"; readelf -d "$f" | grep -E 'NEEDED|SONAME'; done
          cat "$o"/lib*/pkgconfig/libpmem.pc
  configure:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        track: [tentacle, umbrella]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: configure, and build the bundled rocksdb and liburing
        run: |
          nix build -L --no-link --impure --expr '
            let
              f = builtins.getFlake (toString ./.);
              p = f.packages.x86_64-linux."ceph-${{ matrix.track }}";
            in
            p.overrideAttrs (o: {
              dontFixup = true;
              preBuild = "";
              buildPhase = "runHook preBuild; cmake --build . --target rocksdb_ext -j$NIX_BUILD_CORES; ls -la src/rocksdb; runHook postBuild";
              installPhase = "mkdir -p $out $lib $client $dev $doc $man";
            })' 2>&1 | tee configure.log
          grep -E "allocator selected|FUSE|pmdk|RWL|rocksdb" configure.log | head -40
